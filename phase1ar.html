<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOBREAK - AR Comments Scanner</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Tailwind CSS untuk Styling UI yang Konsisten -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f7f9fb;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 0 !important;
        }

        a-scene {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        a-scene canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
            background: transparent !important;
        }
    </style>
</head>

<body class="bg-[#f7f9fb] text-[#191c1e] text-xs sm:text-sm">

    <!-- ==============================
         START SCREEN
    ============================== -->
    <div id="start-screen" class="fixed inset-0 bg-[#f7f9fb] text-[#191c1e] z-[20000] flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-md w-full flex flex-col gap-4 items-center">
            <h1 class="font-bold text-lg text-[#0052CC]">ECHOBREAK AR Komentar</h1>
            <p id="cam-status-text" class="text-xs text-[#434654] mb-1">Memeriksa izin akses kamera...</p>
            
            <div class="flex items-center gap-3 w-full">
                <a href="phase1.html" class="flex-1 py-3 px-4 rounded-xl bg-[#e0e3e5] text-[#434654] font-semibold text-xs sm:text-sm flex items-center justify-center gap-1.5 hover:bg-[#d8dadc] transition-all">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    <span>Kembali</span>
                </a>

                <button id="btn-request-cam" disabled class="flex-1 py-3 px-4 rounded-xl bg-gray-300 text-gray-500 font-semibold text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-none cursor-not-allowed transition-all">
                    <span class="material-symbols-outlined text-base">photo_camera</span>
                    <span id="btn-text">Izinkan Kamera</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ==============================
         UI NAVIGATION
    ============================== -->
    <div id="ar-ui" class="hidden fixed inset-0 z-[10002] pointer-events-none flex flex-col justify-between p-4">
        <div class="flex justify-between items-center pointer-events-auto">
            <div class="bg-black/70 backdrop-blur-md text-white px-3 py-1.5 rounded-lg font-mono text-[11px] border border-white/10">
                Status Marker: <span id="marker-status" class="text-yellow-400 font-bold">Menunggu</span>
            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto w-full max-w-sm mx-auto">
            <a href="phase1.html" class="flex-1 py-2.5 px-3 rounded-xl bg-white/90 backdrop-blur-md text-[#434654] font-semibold text-xs flex items-center justify-center gap-1 shadow-lg hover:bg-white transition-all border border-gray-200">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                <span>Kembali</span>
            </a>
            <a href="phase2.html" class="flex-1 py-2.5 px-3 rounded-xl bg-[#0052CC] text-white font-semibold text-xs flex items-center justify-center gap-1 shadow-lg hover:bg-[#003d9b] transition-all">
                <span>Lanjut Phase 2</span>
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </a>
        </div>
    </div>

    <!-- ==============================
         TAP HINT
    ============================== -->
    <div id="tap-hint" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-black/75 text-white py-1.5 px-3 rounded-full text-[11px] z-[10001] pointer-events-none opacity-0 transition-opacity duration-400">
        Arahkan kamera ke marker untuk melihat opini publik MBG
    </div>

    <!-- ==============================
         AR SCENE
    ============================== -->
    <a-scene mindar-image="
            imageTargetSrc: marker.mind;
            autoStart: false;
        " embedded color-space="sRGB" renderer="
            colorManagement: true;
            alpha: true;
        " vr-mode-ui="
            enabled: false
        " device-orientation-permission-ui="
            enabled: false
        ">

        <a-assets>
            <!-- Canvas untuk Judul dan 6 Komentar -->
            <canvas id="canvasTitle" width="512" height="120"></canvas>
            <canvas id="canvas1" width="512" height="280"></canvas>
            <canvas id="canvas2" width="512" height="280"></canvas>
            <canvas id="canvas3" width="512" height="280"></canvas>
            <canvas id="canvas4" width="512" height="280"></canvas>
            <canvas id="canvas5" width="512" height="280"></canvas>
            <canvas id="canvas6" width="512" height="280"></canvas>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"
                  raycaster="objects: .clickable; far: 10"
                  cursor="fuse: false; rayOrigin: mouse">
        </a-camera>

        <!-- TARGET MARKER (Orientasi rotation="0 0 0" menghadap lurus ke depan) -->
        <a-entity id="target" mindar-image-target="targetIndex: 0">
            
            <!-- Plane Judul Utama di Paling Atas (Menghadap Depan) -->
            <a-plane class="clickable comment-plane" position="0 0.65 0.05" rotation="0 0 0" width="1.4" height="0.25" material="src: #canvasTitle; shader: flat; transparent: true;" visible="false"></a-plane>

            <!-- Baris 1 Komentar (Menghadap Depan) -->
            <a-plane class="clickable comment-plane" position="-0.7 0.15 0.05" rotation="0 0 0" width="0.65" height="0.4" material="src: #canvas1; shader: flat; transparent: true;" visible="false"></a-plane>
            <a-plane class="clickable comment-plane" position="0 0.15 0.05" rotation="0 0 0" width="0.65" height="0.4" material="src: #canvas2; shader: flat; transparent: true;" visible="false"></a-plane>
            <a-plane class="clickable comment-plane" position="0.7 0.15 0.05" rotation="0 0 0" width="0.65" height="0.4" material="src: #canvas3; shader: flat; transparent: true;" visible="false"></a-plane>
            
            <!-- Baris 2 Komentar (Menghadap Depan) -->
            <a-plane class="clickable comment-plane" position="-0.7 -0.35 0.05" rotation="0 0 0" width="0.65" height="0.4" material="src: #canvas4; shader: flat; transparent: true;" visible="false"></a-plane>
            <a-plane class="clickable comment-plane" position="0 -0.35 0.05" rotation="0 0 0" width="0.65" height="0.4" material="src: #canvas5; shader: flat; transparent: true;" visible="false"></a-plane>
            <a-plane class="clickable comment-plane" position="0.7 -0.35 0.05" rotation="0 0 0" width="0.65" height="0.4" material="src: #canvas6; shader: flat; transparent: true;" visible="false"></a-plane>

        </a-entity>

    </a-scene>

    <!-- ==============================
         JAVASCRIPT LOGIC
    ============================== -->
    <script>
        const commentsData = [
            {
                author: "Budi Santoso",
                tag: "[PRO]",
                text: "Shift dini hari adalah langkah taktis paling masuk akal demi mengejar volume produksi yang masif.",
                color: "#16a34a"
            },
            {
                author: "Dr. Siti Rahma",
                tag: "[KONTRA]",
                text: "Bahaya holding time terlalu lama! Nutrisi makanan bisa rusak sebelum anak-anak sempat menyantapnya.",
                color: "#dc2626"
            },
            {
                author: "Ahmad Fauzi",
                tag: "[NETRAL]",
                text: "Programnya bagus, tapi radius distribusi dan SOP jam masak wajib dievaluasi secara berkala.",
                color: "#d97706"
            },
            {
                author: "Dewi Lestari",
                tag: "[PRO]",
                text: "Sangat membantu ekonomi mikro! UMKM sekitar dapur umum jadi punya pasokan bahan baku rutin harian.",
                color: "#16a34a"
            },
            {
                author: "Rian Pratama",
                tag: "[KONTRA]",
                text: "Takutnya ada masalah basi atau penurunan cita rasa karena jarak tempuh ke sekolah terlalu jauh.",
                color: "#dc2626"
            },
            {
                author: "Eko Prasetyo",
                tag: "[NETRAL]",
                text: "Kuncinya ada di teknologi cold chain management dan pembatasan jarak tempuh dapur umum.",
                color: "#d97706"
            }
        ];

        function drawTitleToCanvas() {
            const canvas = document.getElementById("canvasTitle");
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#0052CC";
            ctx.beginPath();
            ctx.roundRect(0, 0, 512, 120, 20);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Pendapat Orang Lain", 256, 45);
            ctx.font = "16px Inter, sans-serif";
            ctx.fillText("Terhadap Berita MBG", 256, 80);
            ctx.textAlign = "left";
        }

        function drawCommentToCanvas(canvasId, item) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.roundRect(0, 0, 512, 280, 20);
            ctx.fill();

            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.fillStyle = item.color;
            ctx.beginPath();
            ctx.roundRect(30, 25, 100, 32, 8);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px Inter, sans-serif";
            ctx.fillText(item.tag, 42, 47);

            ctx.fillStyle = "#434654";
            ctx.font = "bold 15px Inter, sans-serif";
            ctx.fillText(item.author, 145, 47);

            ctx.strokeStyle = "#edf2f7";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(30, 70);
            ctx.lineTo(482, 70);
            ctx.stroke();

            ctx.fillStyle = "#191c1e";
            ctx.font = "16px Inter, sans-serif";
            
            let words = item.text.split(" ");
            let line = "";
            let y = 110;
            let maxWidth = 450;

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + " ";
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, 30, y);
                    line = words[n] + " ";
                    y += 26;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 30, y);
        }

        window.addEventListener("DOMContentLoaded", () => {
            drawTitleToCanvas();
            commentsData.forEach((item, index) => {
                drawCommentToCanvas(`canvas${index + 1}`, item);
            });
            requestCameraAccess();
        });

        const scene = document.querySelector("a-scene");
        const target = document.getElementById("target");
        const commentPlanes = document.querySelectorAll(".comment-plane");
        const startScreen = document.getElementById("start-screen");
        const btnRequestCam = document.getElementById("btn-request-cam");
        const btnText = document.getElementById("btn-text");
        const camStatusText = document.getElementById("cam-status-text");
        const arUi = document.getElementById("ar-ui");
        const markerStatus = document.getElementById("marker-status");
        const tapHint = document.getElementById("tap-hint");

        let cameraGranted = false;

        async function requestCameraAccess() {
            camStatusText.innerText = "Meminta izin akses kamera...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                stream.getTracks().forEach(track => track.stop());

                cameraGranted = true;
                camStatusText.innerText = "Akses kamera diberikan! Silakan lanjut scan.";
                
                btnRequestCam.disabled = false;
                btnRequestCam.classList.remove("bg-gray-300", "text-gray-500", "cursor-not-allowed", "shadow-none");
                btnRequestCam.classList.add("bg-[#0052CC]", "text-white", "cursor-pointer", "shadow-md", "hover:bg-[#003d9b]");
                btnText.innerText = "Lanjut Scan";
            } catch (error) {
                console.error("Izin kamera ditolak:", error);
                cameraGranted = false;
                camStatusText.innerText = "Akses kamera ditolak. Mohon berikan izin kamera pada browser.";
                
                btnRequestCam.disabled = false;
                btnRequestCam.classList.remove("bg-gray-300", "text-gray-500", "cursor-not-allowed", "shadow-none");
                btnRequestCam.classList.add("bg-[#0052CC]", "text-white", "cursor-pointer", "shadow-md", "hover:bg-[#003d9b]");
                btnText.innerText = "Coba Izinkan Lagi";
            }
        }

        btnRequestCam.addEventListener("click", async () => {
            if (!cameraGranted) {
                await requestCameraAccess();
                if (!cameraGranted) return;
            }

            btnRequestCam.disabled = true;
            btnText.innerText = "Memuat AR...";

            startScreen.style.display = "none";
            arUi.classList.remove("hidden");

            try {
                const mindarSystem = scene.systems["mindar-image-system"];
                await mindarSystem.start();
                
                markerStatus.innerText = "Mencari Marker...";
            } catch (err) {
                console.error("Gagal memulai MindAR sistem:", err);
                alert("Terjadi kesalahan saat menginisialisasi AR.");
                window.location.reload();
            }
        });

        target.addEventListener("targetFound", () => {
            markerStatus.innerText = "Ditemukan ✓";
            markerStatus.className = "text-green-400 font-bold";

            commentPlanes.forEach(plane => {
                plane.setAttribute("visible", "true");
            });

            tapHint.classList.add("show");
            setTimeout(() => tapHint.classList.remove("show"), 3000);
        });

        target.addEventListener("targetLost", () => {
            markerStatus.innerText = "Hilang";
            markerStatus.className = "text-yellow-400 font-bold";

            commentPlanes.forEach(plane => {
                plane.setAttribute("visible", "false");
            });
        });
    </script>
</body>
</html>
